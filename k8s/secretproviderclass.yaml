---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ong-donation-worker
  namespace: ong-donation-worker
  labels:
    app: ong-donation-worker
    app.kubernetes.io/name: ong-donation-worker
    app.kubernetes.io/part-of: ong-donation-platform

---
apiVersion: aadpodidentity.k8s.io/v1
kind: AzureIdentity
metadata:
  name: ong-donation-worker-identity
  namespace: ong-donation-worker
  labels:
    app: ong-donation-worker
spec:
  type: 0  # MSI
  resourceID: /subscriptions/{SUBSCRIPTION_ID}/resourcegroups/{RESOURCE_GROUP}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/ong-donation-worker-identity-p
  clientID: {WORKER_CLIENT_ID}

---
apiVersion: aadpodidentity.k8s.io/v1
kind: AzureIdentityBinding
metadata:
  name: ong-donation-worker-binding
  namespace: ong-donation-worker
spec:
  azureIdentity: ong-donation-worker-identity
  selector: ong-donation-worker-selector

---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ong-donation-worker-keyvault-secrets
  namespace: ong-donation-worker
  labels:
    app: ong-donation-worker
spec:
  provider: azure
  parameters:
    usePodIdentity: "true"
    useVMManagedIdentity: "false"
    userAssignedIdentityID: "{WORKER_CLIENT_ID}"
    keyvaultName: "ong-donation-kv-p"
    cloudEnvAzurePublicCloud: "true"
    tenantId: "{TENANT_ID}"
    objects: |
      array:
        - |
          objectName: db-connection-string
          objectType: secret
          objectAlias: DB_CONNECTION_STRING
        - |
          objectName: service-bus-connection-string
          objectType: secret
          objectAlias: SERVICE_BUS_CONNECTION_STRING
        - |
          objectName: appinsights-connection-string
          objectType: secret
          objectAlias: APPINSIGHTS_CONNECTION_STRING
  secretObjects:
  - secretKey: db-connection-string
    objectName: db-connection-string
    data: true
  - secretKey: service-bus-connection-string
    objectName: service-bus-connection-string
    data: true
  - secretKey: appinsights-connection-string
    objectName: appinsights-connection-string
    data: true
