---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ong-donation-worker
  namespace: ong-donation-worker
  labels:
    app: ong-donation-worker
    app.kubernetes.io/name: ong-donation-worker
    app.kubernetes.io/part-of: ong-donation-platform
  annotations:
    azure.workload.identity/client-id: "${WORKER_CLIENT_ID}"

---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ong-donation-worker-keyvault-secrets
  namespace: ong-donation-worker
  labels:
    app: ong-donation-worker
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "${WORKER_CLIENT_ID}"
    keyvaultName: "ong-donation-kv-p-v4"
    tenantId: "${TENANT_ID}"
    objects: |
      array:
        - |
          objectName: worker-db-connection-string
          objectType: secret
        - |
          objectName: service-bus-connection-string
          objectType: secret
        - |
          objectName: appinsights-connection-string
          objectType: secret
  secretObjects:
  - secretName: ong-donation-worker-secrets
    type: Opaque
    data:
    - objectName: worker-db-connection-string
      key: ConnectionStrings__WorkerConnection
    - objectName: service-bus-connection-string
      key: ServiceBus__ConnectionString
    - objectName: appinsights-connection-string
      key: ApplicationInsights__ConnectionString
